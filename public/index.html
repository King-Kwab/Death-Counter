<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Real-time shared death counter dashboard for multi-streamer sessions" />
  <title>💀 Death Counter — Live Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Animated background particles -->
  <div class="bg-particles" id="bgParticles"></div>

  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="header-icon">💀</div>
      <h1 class="header-title">DEATH COUNTER</h1>
      <p class="header-subtitle">Live Session Tracker</p>
    </header>

    <!-- Combined Totals Bar -->
    <div class="totals-bar">
      <div class="totals-item">
        <span class="totals-label">SESSION</span>
        <span class="totals-value" id="totalSession">0</span>
      </div>
      <div class="totals-divider">/</div>
      <div class="totals-item">
        <span class="totals-label">ALL-TIME</span>
        <span class="totals-value" id="totalAllTime">0</span>
      </div>
    </div>

    <!-- Player Cards Grid -->
    <div class="players-grid" id="playersGrid">
      <!-- Cards injected by app.js -->
    </div>

    <!-- Admin Panel (hidden by default) -->
    <div class="admin-panel" id="adminPanel">
      <button class="admin-toggle" id="adminToggle" title="Admin Panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="admin-dropdown" id="adminDropdown">
        <h3 class="admin-title">Admin Controls</h3>
        <div class="admin-field">
          <label for="adminKeyInput">Admin Key</label>
          <input type="password" id="adminKeyInput" placeholder="Enter admin key…" autocomplete="off" />
        </div>
        <div class="admin-buttons">
          <button class="btn btn-warning" id="btnResetSession">
            <span>🔄</span> Reset Session
          </button>
          <button class="btn btn-danger" id="btnResetAll">
            <span>🗑️</span> Reset All
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Connection status -->
  <div class="connection-status" id="connectionStatus">
    <span class="status-dot"></span>
    <span class="status-text">Connecting…</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
